<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gazela BLE Test</title>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      padding: 30px 16px;
      margin: 0;
    }


    main {
      max-width: 700px;
      margin: 0 auto;
    }


    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }


    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      margin: 4px;
      cursor: pointer;
      font-weight: 600;
    }


    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    #connect {
      background: #2563eb;
      color: white;
    }


    #disconnect {
      background: #e5e7eb;
    }


    #sendL {
      background: #111827;
      color: white;
    }


    .section {
      margin-top: 24px;
    }


    .value-box {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 10px;
      word-break: break-word;
    }


    #log {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 10px;
      height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
    }

  </style>

</head>


<body>


<main>


  <div class="card">


    <h1>
      GAZELA SPINER SENSOR
    </h1>


    <p>
      BLE Test — COMMAND + LIVE DATA
    </p>


    <!-- =================================================
         CONNECTION
         ================================================= -->


    <button id="connect">
      CONNECT BLE
    </button>


    <button
      id="disconnect"
      disabled
    >
      DISCONNECT
    </button>


    <!-- =================================================
         COMMAND
         ================================================= -->


    <div class="section">

      <h3>
        COMMAND
      </h3>


      <button
        id="sendL"
        disabled
      >
        SEND L
      </button>

    </div>


    <!-- =================================================
         STATUS
         ================================================= -->


    <div class="section">

      <h3>
        STATUS
      </h3>


      <div
        id="status"
        class="value-box"
      >
        Niepołączony.
      </div>

    </div>


    <!-- =================================================
         LAST COMMAND
         ================================================= -->


    <div class="section">

      <h3>
        LAST COMMAND
      </h3>


      <div
        id="lastCommand"
        class="value-box"
      >
        —
      </div>

    </div>


    <!-- =================================================
         LAST LIVE DATA
         ================================================= -->


    <div class="section">

      <h3>
        LAST LIVE DATA
      </h3>


      <div
        id="value"
        class="value-box"
      >
        —
      </div>

    </div>


    <!-- =================================================
         LOG
         ================================================= -->


    <div class="section">

      <h3>
        LOG
      </h3>


      <div id="log">
Gotowy.
      </div>

    </div>


  </div>


</main>


<script>


  // =====================================================
  // GAZELA SENSOR BLE
  // =====================================================


  // -----------------------------------------------------
  // SENSOR DATA SERVICE
  // -----------------------------------------------------

  const SENSOR_SERVICE_UUID =
    "7a1e0001-5a9a-4c71-9b3a-47415a5a0001";


  // -----------------------------------------------------
  // LIVE DATA CHARACTERISTIC
  // -----------------------------------------------------

  const LIVE_CHARACTERISTIC_UUID =
    "7a1e0002-5a9a-4c71-9b3a-47415a5a0001";


  // -----------------------------------------------------
  // CONTROL SERVICE
  // -----------------------------------------------------

  const CONTROL_SERVICE_UUID =
    "7a1e0010-5a9a-4c71-9b3a-47415a5a0001";


  // -----------------------------------------------------
  // COMMAND CHARACTERISTIC
  // -----------------------------------------------------

  const COMMAND_CHARACTERISTIC_UUID =
    "7a1e0011-5a9a-4c71-9b3a-47415a5a0001";


  // =====================================================
  // CONNECTION VARIABLES
  // =====================================================

  let device = null;

  let server = null;

  let liveCharacteristic = null;

  let commandCharacteristic = null;


  // =====================================================
  // DOM
  // =====================================================

  const connectButton =
    document.getElementById("connect");


  const disconnectButton =
    document.getElementById("disconnect");


  const sendLButton =
    document.getElementById("sendL");


  const status =
    document.getElementById("status");


  const lastCommand =
    document.getElementById("lastCommand");


  const value =
    document.getElementById("value");


  const log =
    document.getElementById("log");


  // =====================================================
  // LOG
  // =====================================================

  function addLog(text)
  {

    log.textContent +=
      "\n" + text;


    // ---------------------------------------------------
    // MAKSYMALNIE 30 LINII
    // ---------------------------------------------------

    const lines =
      log.textContent.split("\n");


    if (lines.length > 30)
    {

      log.textContent =
        lines
          .slice(lines.length - 30)
          .join("\n");

    }


    // ---------------------------------------------------
    // PRZEWIŃ NA DÓŁ
    // ---------------------------------------------------

    log.scrollTop =
      log.scrollHeight;

  }


  // =====================================================
  // DECODE BLE DATA
  // =====================================================

  function decodeValue(dataView)
  {

    return new TextDecoder().decode(

      new Uint8Array(

        dataView.buffer,

        dataView.byteOffset,

        dataView.byteLength

      )

    );

  }


  // =====================================================
  // LIVE NOTIFICATION
  // =====================================================

  function handleNotification(event)
  {

    const text =
      decodeValue(
        event.target.value
      );


    // ---------------------------------------------------
    // POKAZUJEMY TYLKO OSTATNIĄ PRÓBKĘ
    // ---------------------------------------------------

    value.textContent =
      text;


    // ---------------------------------------------------
    // NIE DODAJEMY LIVE DO LOGU
    // ---------------------------------------------------

  }


  // =====================================================
  // CONNECT
  // =====================================================

  connectButton.addEventListener(
    "click",
    async () =>
    {

      try
      {

        // -----------------------------------------------
        // WEB BLUETOOTH CHECK
        // -----------------------------------------------

        if (!navigator.bluetooth)
        {

          throw new Error(
            "Web Bluetooth nie jest dostępny w tej przeglądarce."
          );

        }


        status.textContent =
          "Otwieram wybór urządzenia BLE...";


        // -----------------------------------------------
        // DEVICE SELECTION
        // -----------------------------------------------

        device =
          await navigator.bluetooth.requestDevice(
          {

            filters:
            [

              {
                name:
                  "GAZELA SENSOR"
              }

            ],

            optionalServices:
            [

              SENSOR_SERVICE_UUID,

              CONTROL_SERVICE_UUID

            ]

          });


        addLog(
          "DEVICE → " +
          device.name
        );


        // -----------------------------------------------
        // DISCONNECT EVENT
        // -----------------------------------------------

        device.addEventListener(
          "gattserverdisconnected",
          handleDisconnect
        );


        status.textContent =
          "Łączenie z GAZELA SENSOR...";


        // -----------------------------------------------
        // GATT CONNECT
        // -----------------------------------------------

        server =
          await device.gatt.connect();


        addLog(
          "GATT CONNECTED"
        );


        // =================================================
        // SENSOR SERVICE
        // =================================================

        const sensorService =
          await server.getPrimaryService(
            SENSOR_SERVICE_UUID
          );


        addLog(
          "SENSOR SERVICE OK"
        );


        // =================================================
        // LIVE CHARACTERISTIC
        // =================================================

        liveCharacteristic =
          await sensorService.getCharacteristic(
            LIVE_CHARACTERISTIC_UUID
          );


        addLog(
          "LIVE CHARACTERISTIC OK"
        );


        // -----------------------------------------------
        // READ
        // -----------------------------------------------

        const data =
          await liveCharacteristic.readValue();


        value.textContent =
          decodeValue(data);


        addLog(
          "READ OK"
        );


        // -----------------------------------------------
        // NOTIFICATION HANDLER
        // -----------------------------------------------

        liveCharacteristic.addEventListener(
          "characteristicvaluechanged",
          handleNotification
        );


        // -----------------------------------------------
        // NOTIFY
        // -----------------------------------------------

        await liveCharacteristic.startNotifications();


        addLog(
          "NOTIFY ON"
        );


        // =================================================
        // CONTROL SERVICE
        // =================================================

        const controlService =
          await server.getPrimaryService(
            CONTROL_SERVICE_UUID
          );


        addLog(
          "CONTROL SERVICE OK"
        );


        // =================================================
        // COMMAND CHARACTERISTIC
        // =================================================

        commandCharacteristic =
          await controlService.getCharacteristic(
            COMMAND_CHARACTERISTIC_UUID
          );


        addLog(
          "COMMAND CHARACTERISTIC OK"
        );


        // =================================================
        // READY
        // =================================================

        status.textContent =
          "POŁĄCZONO — LIVE OFF";


        connectButton.disabled =
          true;


        disconnectButton.disabled =
          false;


        sendLButton.disabled =
          false;


        addLog(
          "READY — nacisnij SEND L"
        );

      }


      catch (error)
      {

        console.error(error);


        status.textContent =
          "BŁĄD: " +
          error.message;


        addLog(
          "ERROR → " +
          error.message
        );

      }

    }
  );


  // =====================================================
  // SEND L
  // =====================================================

  sendLButton.addEventListener(
    "click",
    async () =>
    {

      try
      {

        if (!commandCharacteristic)
        {

          throw new Error(
            "COMMAND characteristic nie jest dostępna."
          );

        }


        // -----------------------------------------------
        // COMMAND
        // -----------------------------------------------

        const command =
          new TextEncoder().encode(
            "L"
          );


        // -----------------------------------------------
        // WRITE
        // -----------------------------------------------

        await commandCharacteristic.writeValue(
          command
        );


        // -----------------------------------------------
        // UI
        // -----------------------------------------------

        lastCommand.textContent =
          "L";


        status.textContent =
          "WYSŁANO KOMENDĘ L";


        addLog(
          "COMMAND → L"
        );

      }


      catch (error)
      {

        console.error(error);


        addLog(
          "COMMAND ERROR → " +
          error.message
        );

      }

    }
  );


  // =====================================================
  // DISCONNECT HANDLER
  // =====================================================

  function handleDisconnect()
  {

    status.textContent =
      "Sensor rozłączony.";


    addLog(
      "GATT DISCONNECTED"
    );


    connectButton.disabled =
      false;


    disconnectButton.disabled =
      true;


    sendLButton.disabled =
      true;


    liveCharacteristic =
      null;


    commandCharacteristic =
      null;


    server =
      null;

  }


  // =====================================================
  // DISCONNECT BUTTON
  // =====================================================

  disconnectButton.addEventListener(
    "click",
    () =>
    {

      if (
        device &&
        device.gatt &&
        device.gatt.connected
      )
      {

        device.gatt.disconnect();

      }

    }
  );


</script>


</body>

</html>
