<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gazela Sensor BLE Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #f0f0f0;
    }

    .primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .danger {
      background: #dc2626;
      color: white;
      border-color: #dc2626;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
    }

    .value {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      margin-top: 8px;
      font-family: monospace;
    }

    #log {
      background: #111;
      color: #ddd;
      padding: 12px;
      border-radius: 8px;
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>


<body>

<div class="container">

  <h1>GAZELA SENSOR — BLE TEST</h1>


  <!-- ===================================================== -->
  <!-- CONNECTION -->
  <!-- ===================================================== -->

  <div class="card">

    <h2>Połączenie</h2>

    <div id="status" class="status">
      NIEPOŁĄCZONO
    </div>

    <button
      id="connectButton"
      class="primary"
    >
      CONNECT BLE
    </button>

    <button
      id="disconnectButton"
    >
      DISCONNECT
    </button>

  </div>


  <!-- ===================================================== -->
  <!-- CONTROL -->
  <!-- ===================================================== -->

  <div class="card">

    <h2>Sterowanie LIVE</h2>

    <button
      id="sendLButton"
      class="primary"
    >
      SEND L
    </button>

    <button
      id="sendQButton"
      class="danger"
    >
      SEND Q
    </button>

    <p>
      L = uruchom LIVE<br>
      Q = zatrzymaj LIVE
    </p>

    <div>
      Ostatnia komenda:
    </div>

    <div
      id="lastCommand"
      class="value"
    >
      —
    </div>

  </div>


  <!-- ===================================================== -->
  <!-- LIVE DATA -->
  <!-- ===================================================== -->

  <div class="card">

    <h2>LIVE DATA</h2>

    <div>
      Ostatnie dane:
    </div>

    <div
      id="lastLiveData"
      class="value"
    >
      —
    </div>

  </div>


  <!-- ===================================================== -->
  <!-- LOG -->
  <!-- ===================================================== -->

  <div class="card">

    <h2>LOG</h2>

    <div id="log"></div>

  </div>

</div>


<script>

// ============================================================
// UUID
// ============================================================

const SENSOR_SERVICE_UUID =
  "7a1e0001-5a9a-4c71-9b3a-47415a5a0001";

const LIVE_CHARACTERISTIC_UUID =
  "7a1e0002-5a9a-4c71-9b3a-47415a5a0001";

const CONTROL_SERVICE_UUID =
  "7a1e0010-5a9a-4c71-9b3a-47415a5a0001";

const COMMAND_CHARACTERISTIC_UUID =
  "7a1e0011-5a9a-4c71-9b3a-47415a5a0001";


// ============================================================
// ELEMENTS
// ============================================================

const connectButton =
  document.getElementById("connectButton");

const disconnectButton =
  document.getElementById("disconnectButton");

const sendLButton =
  document.getElementById("sendLButton");

const sendQButton =
  document.getElementById("sendQButton");

const statusElement =
  document.getElementById("status");

const lastCommandElement =
  document.getElementById("lastCommand");

const lastLiveDataElement =
  document.getElementById("lastLiveData");

const logElement =
  document.getElementById("log");


// ============================================================
// BLE VARIABLES
// ============================================================

let device = null;

let liveCharacteristic = null;

let commandCharacteristic = null;


// ============================================================
// LOG
// ============================================================

function log(message)
{
  const line =
    document.createElement("div");

  line.textContent =
    message;

  logElement.appendChild(line);


  // Maksymalnie 30 wpisów

  while (
    logElement.children.length > 30
  )
  {
    logElement.removeChild(
      logElement.firstChild
    );
  }


  logElement.scrollTop =
    logElement.scrollHeight;
}


// ============================================================
// STATUS
// ============================================================

function setStatus(message)
{
  statusElement.textContent =
    message;
}


// ============================================================
// CONNECT
// ============================================================

async function connectBLE()
{
  try
  {
    log("Łączenie z GAZELA SENSOR...");


    // --------------------------------------------------------
    // Wybór urządzenia
    // --------------------------------------------------------

    device =
      await navigator.bluetooth.requestDevice({

        filters: [
          {
            name: "GAZELA SENSOR"
          }
        ],

        optionalServices: [
          SENSOR_SERVICE_UUID,
          CONTROL_SERVICE_UUID
        ]

      });


    log(
      "Wybrano: " +
      device.name
    );


    // --------------------------------------------------------
    // Disconnect event
    // --------------------------------------------------------

    device.addEventListener(
      "gattserverdisconnected",
      handleDisconnect
    );


    // --------------------------------------------------------
    // GATT CONNECT
    // --------------------------------------------------------

    const server =
      await device.gatt.connect();


    log("GATT CONNECTED");


    // ========================================================
    // SENSOR SERVICE
    // ========================================================

    const sensorService =
      await server.getPrimaryService(
        SENSOR_SERVICE_UUID
      );


    // ========================================================
    // LIVE CHARACTERISTIC
    // ========================================================

    liveCharacteristic =
      await sensorService.getCharacteristic(
        LIVE_CHARACTERISTIC_UUID
      );


    // --------------------------------------------------------
    // Initial read
    // --------------------------------------------------------

    try
    {
      const value =
        await liveCharacteristic.readValue();

      const text =
        new TextDecoder().decode(value);

      lastLiveDataElement.textContent =
        text;
    }
    catch (error)
    {
      log(
        "READ LIVE: " +
        error.message
      );
    }


    // --------------------------------------------------------
    // Notifications
    // --------------------------------------------------------

    liveCharacteristic.addEventListener(
      "characteristicvaluechanged",
      handleLiveNotification
    );


    await liveCharacteristic.startNotifications();


    log(
      "LIVE NOTIFY ON"
    );


    // ========================================================
    // CONTROL SERVICE
    // ========================================================

    const controlService =
      await server.getPrimaryService(
        CONTROL_SERVICE_UUID
      );


    // ========================================================
    // COMMAND CHARACTERISTIC
    // ========================================================

    commandCharacteristic =
      await controlService.getCharacteristic(
        COMMAND_CHARACTERISTIC_UUID
      );


    log(
      "COMMAND CHARACTERISTIC READY"
    );


    setStatus(
      "POŁĄCZONO — LIVE OFF"
    );

  }
  catch (error)
  {
    console.error(error);

    log(
      "BŁĄD: " +
      error.message
    );

    setStatus(
      "BŁĄD POŁĄCZENIA"
    );
  }
}


// ============================================================
// LIVE NOTIFICATION
// ============================================================

function handleLiveNotification(event)
{
  const value =
    event.target.value;

  const text =
    new TextDecoder().decode(value);


  lastLiveDataElement.textContent =
    text;
}


// ============================================================
// SEND COMMAND
// ============================================================

async function sendCommand(command)
{
  if (
    !commandCharacteristic
  )
  {
    log(
      "Brak połączenia z COMMAND"
    );

    return;
  }


  try
  {
    const data =
      new TextEncoder().encode(
        command
      );


    await commandCharacteristic.writeValue(
      data
    );


    lastCommandElement.textContent =
      command;


    log(
      "Wysłano: " +
      command
    );


    if (command === "L")
    {
      setStatus(
        "POŁĄCZONO — LIVE ON"
      );
    }


    if (command === "Q")
    {
      setStatus(
        "POŁĄCZONO — LIVE OFF"
      );
    }

  }
  catch (error)
  {
    console.error(error);

    log(
      "BŁĄD COMMAND: " +
      error.message
    );
  }
}


// ============================================================
// DISCONNECT
// ============================================================

function disconnectBLE()
{
  if (
    device &&
    device.gatt &&
    device.gatt.connected
  )
  {
    device.gatt.disconnect();
  }
}


// ============================================================
// DISCONNECT HANDLER
// ============================================================

function handleDisconnect()
{
  log(
    "BLE DISCONNECTED"
  );


  setStatus(
    "NIEPOŁĄCZONO"
  );


  liveCharacteristic = null;

  commandCharacteristic = null;
}


// ============================================================
// BUTTONS
// ============================================================

connectButton.addEventListener(
  "click",
  connectBLE
);


disconnectButton.addEventListener(
  "click",
  disconnectBLE
);


sendLButton.addEventListener(
  "click",
  () => sendCommand("L")
);


sendQButton.addEventListener(
  "click",
  () => sendCommand("Q")
);

</script>

</body>
</html>
